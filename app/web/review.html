<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review Queue · Defect-to-Action</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="review.css">
</head>
<body>
  <header class="topbar">
    <h1>검수 대기열</h1>
    <div class="stats">
      <span>남은 작업 <strong id="stat-pending">0</strong></span>
      <span>오늘 처리 <strong id="stat-done-today">0</strong></span>
    </div>
    <span id="mode-badge" class="mode-badge"></span>
  </header>

  <main class="layout">
    <!-- Pending review tasks -->
    <aside class="panel list-panel">
      <h2>대기 중</h2>
      <ul id="task-list" class="task-list"></ul>
      <p id="empty-message" class="empty" hidden>대기 중인 작업이 없습니다.</p>
    </aside>

    <!-- Inspection image with candidate defect boxes -->
    <section class="panel viewer-panel">
      <div id="viewer-meta" class="viewer-meta"></div>
      <div class="canvas-wrap">
        <canvas id="viewer"></canvas>
      </div>
      <p id="draw-hint" class="draw-hint" hidden>드래그로 박스를 그리고 <kbd>Enter</kbd>로 확정 · <kbd>Esc</kbd>로 취소</p>
    </section>

    <!-- Reviewer decision -->
    <aside class="panel decision-panel">
      <label for="reviewer">검수자</label>
      <input id="reviewer" type="text" placeholder="이름" autocomplete="off">
      <button id="btn-confirm" class="btn confirm" type="button">승인 <kbd>A</kbd></button>
      <button id="btn-reject" class="btn reject" type="button">반려 <kbd>R</kbd></button>
      <button id="btn-missed" class="btn missed" type="button">놓친 결함 추가 <kbd>M</kbd></button>
      <p class="shortcut-help"><kbd>↑</kbd> <kbd>↓</kbd> 목록 이동</p>
      <div id="notice" class="notice" role="status" hidden></div>
    </aside>
  </main>

  <script src="review.js"></script>
</body>
</html>
