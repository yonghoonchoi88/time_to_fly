name: ai-server

on:
  pull_request:
    paths: ["ai-server/**", ".github/workflows/ai-server.yml"]
  push:
    branches: [main]
    paths: ["ai-server/**", ".github/workflows/ai-server.yml"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
